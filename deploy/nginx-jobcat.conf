# nginx configuration for jobcat.in (frontend)
# /etc/nginx/sites-available/jobcat.in
#
# Next.js standalone server listens on 127.0.0.1:3000 (see jobcat-frontend.service).
# The Django API is served separately at https://app.jobcat.in — no proxying here.

limit_req_zone $binary_remote_addr zone=jobcat_general:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name jobcat.in www.jobcat.in;

    # Certbot will manage the redirect to HTTPS after issuing certificates.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jobcat.in www.jobcat.in;

    # TLS certificates (adjust paths if using a different ACME client)
    ssl_certificate     /etc/letsencrypt/live/jobcat.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobcat.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 5m;

    # Basic rate limiting
    limit_req zone=jobcat_general burst=60 nodelay;

    # Immutable static assets from Next.js build
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else -> Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
